<!DOCTYPE html>
<html lang="fr">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width"><title>TBTM — Accueil</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; font-family: system-ui, sans-serif; }
body { background:#111; display:flex; justify-content:center; padding:20px; }
.phone { width:300px; background:#0a0a12; border-radius:32px; border:2px solid #1e1a3a; overflow:hidden; }
.card { background:#12112a; border-radius:14px; border:0.5px solid #7c3aed22; padding:12px; margin-bottom:10px; }
.accent { color:#a78bfa; } .muted { color:#4a4a6a; } .white { color:#fff; }
</style></head>
<body>
<div class="phone">
  <div style="padding:16px 16px 0;">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;">
      <span style="font-size:16px;font-weight:500;color:#fff;">Bonjour, Yassine 👋</span>
      <div style="width:30px;height:30px;border-radius:50%;background:#7c3aed22;border:1px solid #7c3aed55;display:flex;align-items:center;justify-content:center;">
        <span style="font-size:13px;color:#a78bfa;">Y</span>
      </div>
    </div>
    <span style="font-size:11px;color:#4a4a6a;">Niveau 8 · Streak 12j 🔥</span>
    <div style="margin:10px 0 14px;background:#1e1a3a;border-radius:4px;height:4px;">
      <div style="background:#7c3aed;width:81%;height:4px;border-radius:4px;"></div>
    </div>
  </div>
  <div style="padding:0 16px;">
    <div class="card" style="border-color:#7c3aed55;">
      <div style="font-size:10px;color:#7c3aed99;margin-bottom:4px;">Prochaine séance</div>
      <div style="font-size:14px;font-weight:500;color:#fff;">Push Day A</div>
      <div style="font-size:10px;color:#4a4a6a;margin-top:2px;">4 exercices · ~50 min</div>
      <div style="margin-top:10px;background:#7c3aed;border-radius:8px;padding:9px;text-align:center;">
        <span style="font-size:13px;font-weight:500;color:#fff;">Lancer la séance ⚡</span>
      </div>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px;">
      <div class="card"><div style="font-size:10px;color:#4a4a6a;margin-bottom:3px;">Volume ce mois</div><div style="font-size:20px;font-weight:500;color:#fff;">42t</div><div style="font-size:10px;color:#5dcaa5;">+8%</div></div>
      <div class="card"><div style="font-size:10px;color:#4a4a6a;margin-bottom:3px;">Séances</div><div style="font-size:20px;font-weight:500;color:#fff;">14</div><div style="font-size:10px;color:#5dcaa5;">+2 vs mois dernier</div></div>
    </div>
    <div class="card">
      <div style="font-size:11px;color:#4a4a6a;margin-bottom:8px;">Cette semaine</div>
      <div style="display:flex;gap:4px;align-items:flex-end;height:40px;">
        <div style="flex:1;background:#2d2060;border-radius:2px;height:40%;"></div>
        <div style="flex:1;background:#3d2a80;border-radius:2px;height:70%;"></div>
        <div style="flex:1;background:#1e1a3a;border-radius:2px;height:20%;"></div>
        <div style="flex:1;background:#5535a0;border-radius:2px;height:85%;"></div>
        <div style="flex:1;background:#7c3aed;border-radius:2px;height:100%;"></div>
        <div style="flex:1;background:#1e1a3a;border-radius:2px;height:15%;opacity:0.3;"></div>
        <div style="flex:1;background:#1e1a3a;border-radius:2px;height:15%;opacity:0.3;"></div>
      </div>
    </div>
    <div style="font-size:10px;color:#4a4a6a;margin-bottom:8px;letter-spacing:0.05em;">DERNIERS PRs</div>
    <div class="card" style="margin-bottom:16px;">
      <div style="display:flex;flex-direction:column;gap:5px;">
        <div style="display:flex;justify-content:space-between;align-items:center;padding:6px 8px;background:#0a0a12;border-radius:8px;">
          <span style="font-size:11px;color:#fff;">Développé couché</span>
          <div><span style="font-size:12px;font-weight:500;color:#ef9f27;">70kg × 8</span><span style="font-size:10px;color:#5dcaa5;margin-left:6px;">+2.5kg</span></div>
        </div>
        <div style="display:flex;justify-content:space-between;align-items:center;padding:6px 8px;background:#0a0a12;border-radius:8px;">
          <span style="font-size:11px;color:#fff;">Dips lestés</span>
          <div><span style="font-size:12px;font-weight:500;color:#ef9f27;">BW+20kg × 6</span><span style="font-size:10px;color:#5dcaa5;margin-left:6px;">+2.5kg</span></div>
        </div>
      </div>
    </div>
  </div>
  <div style="display:flex;justify-content:space-around;padding:10px 0 14px;border-top:0.5px solid #1e1a3a;">
    <span style="font-size:18px;">🏠</span><span style="font-size:18px;opacity:0.3;">📊</span><span style="font-size:18px;opacity:0.3;">➕</span><span style="font-size:18px;opacity:0.3;">🥗</span><span style="font-size:18px;opacity:0.3;">👤</span>
  </div>
</div>
</body></html>
